<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    color-scheme: light dark;
    --editor-font: ui-monospace, "SF Mono", Menlo, monospace;
    --editor-size: 14px;
    --bg: #ffffff;
    --fg: #1f2328;
    --caret: #1f2328;
    --border: #d0d7de;
    --gutter-fg: #8c959f;
    --active-line: rgba(9, 105, 218, 0.05);
    --selection: rgba(9, 105, 218, 0.22);
    --match-bg: rgba(9, 105, 218, 0.18);
    --search-bg: rgba(255, 213, 0, 0.35);
    --search-active-bg: rgba(255, 150, 0, 0.55);
    --panel-bg: #f6f8fa;
    --md-heading: #0550ae;
    --md-link: #0969da;
    --md-code: #953800;
    --md-quote: #57606a;
    --md-mark: #8250df;
    --md-meta: #6e7781;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --caret: #e6edf3;
      --border: #30363d;
      --gutter-fg: #6e7681;
      --active-line: rgba(56, 139, 253, 0.07);
      --selection: rgba(56, 139, 253, 0.32);
      --match-bg: rgba(56, 139, 253, 0.25);
      --search-bg: rgba(187, 128, 9, 0.4);
      --search-active-bg: rgba(210, 153, 34, 0.7);
      --panel-bg: #161b22;
      --md-heading: #79c0ff;
      --md-link: #58a6ff;
      --md-code: #ffa657;
      --md-quote: #9198a1;
      --md-mark: #d2a8ff;
      --md-meta: #8b949e;
    }
  }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #editor { height: 100%; }
</style>
</head>
<body>
<div id="editor"></div>
<script src="codemirror-editor.min.js"></script>
</body>
</html>
